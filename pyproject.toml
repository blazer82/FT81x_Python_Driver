[build-system]
requires = ["scikit-build-core>=0.8", "cmake>=3.20"]
build-backend = "scikit_build_core.build"

[project]
name = "ft81x"
version = "0.1.0"
description = "FT81x GPU driver for Raspberry Pi 5"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Raphael Staebler", email = "raphael.staebler@productionbuild.de"},
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.scikit-build]
wheel.packages = ["ft81x"]
cmake.build-type = "Release"
